# Ollama systemd service override
# File location: /etc/systemd/system/ollama.service
#
# After editing run:
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Key change: OLLAMA_HOST=0.0.0.0:11434 makes Ollama
# accessible from Docker containers and VMs on the network
# (default is 127.0.0.1:11434 which is localhost only)

[Unit]
Description=Ollama Service
After=network-online.target

[Service]
ExecStart=/usr/local/bin/ollama serve
User=ollama
Group=ollama
Restart=always
RestartSec=3
Environment="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/cuda/bin"
Environment="OLLAMA_HOST=0.0.0.0:11434"

[Install]
WantedBy=default.target
