# Promtail config for MongoDB VM
# Replace LOKI_IP with your WSL2 laptop IP (e.g. 172.21.47.67)
# File location on VM: /etc/promtail/config.yml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://LOKI_IP:3100/loki/api/v1/push

scrape_configs:
  # MongoDB logs
  - job_name: mongodb
    static_configs:
      - targets: [localhost]
        labels:
          job: mongodb
          host: __HOSTNAME__
          env: lab
          __path__: /var/log/mongodb/mongod.log
    pipeline_stages:
      - json:
          expressions:
            severity: s
            component: c
            message: msg
      - labels:
          severity:
          component:

  # System logs
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          host: __HOSTNAME__
          env: lab
          __path__: /var/log/syslog
