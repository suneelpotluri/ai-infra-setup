# Promtail config for RHEL/CentOS/Rocky Linux Ansible VM
# Replace LOKI_IP with your WSL2 laptop IP (e.g. 172.21.47.67)
# File location on VM: /etc/promtail/config.yml
# Note: RHEL uses /var/log/messages not /var/log/syslog

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://LOKI_IP:3100/loki/api/v1/push

scrape_configs:
  # System logs (RHEL path)
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          host: __HOSTNAME__
          env: lab
          os: rhel
          __path__: /var/log/messages

  # Ansible logs
  - job_name: ansible
    static_configs:
      - targets: [localhost]
        labels:
          job: ansible
          host: __HOSTNAME__
          env: lab
          __path__: /var/log/ansible.log

  # Auth logs
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          host: __HOSTNAME__
          env: lab
          __path__: /var/log/secure
